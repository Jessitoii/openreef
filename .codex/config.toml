# =============================================================================
# OpenReef - Codex config.toml
# =============================================================================

# ====================== CORE MODEL ======================

# Reasoning kalitesi (Flutter gibi kompleks projelerde yüksek önerilir)
model_reasoning_summary = "detailed"
model_verbosity = "medium"

# ====================== APPROVAL & GÜVENLIK ======================

[sandbox_workspace_write]
network_access = true

# ====================== PROJE DOKÜMANLARI ======================
project_doc_max_bytes = 65536        # AGENTS.md + docs klasörü için yeterli alan
project_doc_fallback_filenames = ["AGENTS.md", "README.md", "docs/01-features.md", "docs/02-architecture.md"]
